name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore LinuxIpDiscovery.slnx
      - name: Build
        run: dotnet build LinuxIpDiscovery.slnx -c Release --no-restore
      - name: Test
        run: dotnet test LinuxIpDiscovery.slnx -c Release --no-build --verbosity normal
